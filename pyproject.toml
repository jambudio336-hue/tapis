[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tapis"
version = "0.1.0"
description = "LIMS - Lawful Interception Management System untuk Indonesia"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "m4zk1pL4y" }]
keywords = ["lims", "lawful-interception", "wiretap", "indonesia", "etsi"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "rich>=13.7",
    "typer>=0.9",
    "python-multipart>=0.0.9",
    "httpx>=0.26",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.3"]

[project.scripts]
tapis = "tapis.cli:main"

[tool.setuptools.packages.find]
include = ["tapis*"]

[tool.setuptools.package-data]
tapis = ["schema.sql", "web/*", "web/**/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
